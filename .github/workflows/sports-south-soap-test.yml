          print('INTERRUPTION RECOVERY SIMULATION: PASS across',len(sequence)+1,'batch boundaries')
          print('Write path remains locked; simulated recovery is not a production transaction guarantee.')
          with open('/tmp/ss-import-readiness.json','w') as output:
            json.dump(report,output,indent=2,sort_keys=True)
          print('=== FINAL IMPORT PLAN (NO WRITES) ===')
          print('Eligible inserts:',len(insert_plan))
          print('Held new records by reason:',dict(held_new))
          print('Verified-field updates:',len(update_plan))
          print('Update fields:',report['update_field_counts'])
          print('Unchanged existing:',report['unchanged_count'])
          print('Report: ss-import-readiness.json (hashed IDs, counts only)')
          # Controlled-write implementation is deliberately unreachable until a
          # separate reviewed workflow change explicitly enables it. It does not
          # run during workflow_dispatch dry_run.
          def execute_approved_limited_import(approved_ids, approved_updates):
            if os.environ.get('IMPORT_MODE')!='limited_import':
              raise SystemExit('Write path locked: limited_import mode is not enabled')
            if not PRODUCTION_ACTIVATED or os.environ.get('CONFIRMATION_PHRASE')!='AUTHORIZE LIMITED SPORTS SOUTH IMPORT':
              raise SystemExit('Write path locked: explicit production authorization not active')
            if os.environ.get('ENABLE_SPORTS_SOUTH_WRITES')!='true':
              raise SystemExit('Write path locked: missing deployment approval gate')
            if not expected_digest or not __import__('hmac').compare_digest(expected_digest.lower(),report['approved_payload_digest']):
              raise SystemExit('Write path locked: approved payload fingerprint missing or changed')
            if set(approved_ids)!=set(insert_plan):
              raise SystemExit('Write path locked: approved insert plan has drifted')
            if set(approved_updates)!=set(item for item,_ in update_plan):
              raise SystemExit('Write path locked: approved update plan has drifted')
            if len(approved_ids)>25 or len(approved_updates)>10:
              raise SystemExit('Write path locked: batch exceeds first-import limits')
            # Do not use upsert for inserts: a concurrent insertion must fail
            # rather than silently overwrite a supplier row.
            def call(method,url,payload):
              body=json.dumps(payload).encode('utf-8')
              request=urllib.request.Request(url,data=body,method=method,headers={
                'apikey':key,'Authorization':'Bearer '+key,
                'Content-Type':'application/json','Prefer':'return=representation'})
              with urllib.request.urlopen(request,timeout=30) as response:
                return json.load(response)
            def build_row(item):
              fields=incoming[item]
              row={'item_no':item,'attributes':{}}
              for column,source in safe_map.items():
                row[column]=fields.get(source,'')
              row['brand_id']=fields.get('IMFGNO','')
              return row
            # On retry, check each current row before any write. A row that
            # already equals its approved target is skipped; any unexpected
            # third state stops the batch instead of overwriting it.
            def current_row(item):
              query=urllib.parse.urlencode({'select':'item_no,description,short_description,manufacturer_item_no,model,upc,brand_id,category_id,image_ref,attributes',
                'item_no':'eq.'+item})
              request=urllib.request.Request(endpoint+'?'+query,headers={
                'apikey':key,'Authorization':'Bearer '+key,'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=25) as response:
                records=json.load(response)
              if len(records)>1: raise SystemExit('Duplicate ITEMNO in readback')
              return records[0] if records else None
            def equal_fields(actual,target,keys):
              return actual is not None and all(
                str(actual.get(column) or '').strip()==str(target.get(column) or '').strip()
                for column in keys)
            verified_inserts=verified_updates=skipped=0
            for item in sorted(approved_ids):
              row=build_row(item)
              current=current_row(item)
              if current is not None:
                if equal_fields(current,row,list(safe_map)+['item_no','brand_id']) and current.get('attributes')=={}:
                  skipped+=1
                  continue
                raise SystemExit('Insert collision differs from approved target; stop')
              try:
                call('POST',endpoint,row)
              except Exception:
                # Ambiguous network failure: inspect current state before stopping.
                if not equal_fields(current_row(item),row,list(safe_map)+['item_no','brand_id']):
                  raise
              verified=current_row(item)
              if not equal_fields(verified,row,list(safe_map)+['item_no','brand_id']) or verified.get('attributes')!={}:
                raise SystemExit('Insert readback mismatch; stop')
              verified_inserts+=1
            for item in sorted(approved_updates):
              fields=incoming[item]
              old=existing[item]
              changes={column:fields.get(source,'') for column,source in safe_map.items()
                       if str(old.get(column) or '').strip()!=fields.get(source,'').strip()}
              if not changes: continue
              current=current_row(item)
              if current is None: raise SystemExit('Update target missing; stop')
              if equal_fields(current,changes,list(changes)):
                skipped+=1
                continue
              if not equal_fields(current,old,list(safe_map)+['brand_id']):
                raise SystemExit('Update target drifted from approved snapshot; stop')
              # CAS filters prevent writing if another process changes the row.
              filters={'item_no':'eq.'+item}
              for column in changes:
                original=old.get(column)
                filters[column]='eq.'+str(original) if original is not None else 'is.null'
              url=endpoint+'?'+urllib.parse.urlencode(filters)
              try:
                updated=call('PATCH',url,changes)
                if len(updated)!=1: raise SystemExit('Concurrent update conflict; stop')
              except Exception:
                if not equal_fields(current_row(item),changes,list(changes)):
                  raise
              verified=current_row(item)
              if not equal_fields(verified,changes,list(changes)) or str(verified.get('brand_id') or '')!=str(old.get('brand_id') or ''):
                raise SystemExit('Update readback mismatch or brand drift; stop')
              verified_updates+=1
            print('LIMITED IMPORT VERIFIED inserts:',verified_inserts,
                  'updates:',verified_updates,'already-applied:',skipped,'checkpoint writes: 0')
          if mode=='limited_import':
            if len(insert_plan)!=15 or len(update_plan)!=1 or any(changed!=['short_description'] for _,changed in update_plan):
              raise SystemExit('Approved first-import counts or update fields drifted; no writes')
            if held_new or cross_either or len(mismatches)!=24:
              raise SystemExit('Approved first-import screening drifted; no writes')
            if not __import__('hmac').compare_digest(report['approved_payload_digest'],PINNED_APPROVED_DIGEST):
              raise SystemExit('Pinned production payload drifted; no writes')
            # Final pre-write reconciliation, after all screening and validation.
            if len(insert_plan)+sum(held_new.values())!=len(incoming_new) or len(update_plan)+report['unchanged_count']!=len(existing):
              raise SystemExit('Import reconciliation failed; no writes')
            execute_approved_limited_import(sorted(insert_plan),[item for item,_ in sorted(update_plan)])
            print('Approved limited import completed; all writes individually read back.')
          else:
            print('Production mode: dry_run; no writes.')
          if len(insert_plan)+sum(held_new.values())!=len(incoming_new):
            raise SystemExit('Import plan reconciliation failed: new records')
          if len(update_plan)+report['unchanged_count']!=len(existing):
            raise SystemExit('Import plan reconciliation failed: existing records')
          if len(mismatches)>len(existing):
            raise SystemExit('Import plan reconciliation failed: brand conflicts')
          print('Plan reconciliation: PASS; all incoming records accounted for.')
          print('Decision:', 'DRY RUN ONLY' if mode=='dry_run' else 'APPROVED LIMITED IMPORT', '; supplier pricing and checkpoint writes excluded.')
          print('No raw supplier values, customer identifiers, or credentials printed.')
          print('Sync checkpoints changed: 0; write counts shown in verified import output when applicable.')
          PY
      - name: Consolidated read-only integrity and safety audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          path='/tmp/ss-import-readiness.json'
          if not os.path.isfile(path):
            raise SystemExit('Audit cannot proceed: reconciliation report missing')
          with open(path) as f: r=json.load(f)
          p=r.get('pagination_audit') or {}
          ready=r.get('incremental_readiness') or {}
          checks={
            'documented_continuation':r.get('pagination_contract_documented') is True and p.get('supplier_contract_confirmed') is True,
            'bounded_pagination':p.get('bounded_pagination_passed') is True and r.get('supplier_pagination_verified') is True,
            'page_count_reconciliation':sum(p.get('page_counts',[]))==p.get('total_unique')==r.get('incoming_count'),
            'new_record_reconciliation':r.get('new_count')==r.get('eligible_insert_count',0)+sum((r.get('held_new_counts') or {}).values()),
            'existing_record_reconciliation':r.get('existing_count')==r.get('update_count',0)+r.get('unchanged_count',0),
            'review_queue_reconciliation':all(len(v)==(r.get('held_new_counts') or {}).get(k) for k,v in (r.get('held_new_id_hashes_by_reason') or {}).items()) and sum(len(v) for v in (r.get('held_new_id_hashes_by_reason') or {}).values())==sum((r.get('held_new_counts') or {}).values()),
            'brand_review_reconciliation':len(r.get('brand_conflict_id_hashes',[]))==r.get('brand_conflict_count'),
            'pricing_excluded':r.get('supplier_pricing')=='excluded',
            'no_database_writes':r.get('database_writes')==0 and r.get('production_enabled') is False,
            'no_checkpoint_writes':r.get('sync_checkpoint_writes')==0 and r.get('cursor_advancement_permitted') is False,
            'automatic_schedule_disabled':ready.get('automatic_schedule_enabled') is False,
            'dry_run_only':r.get('mode')=='dry_run',
          }
          audit={'schema_version':1,'overall':'PASS' if all(checks.values()) else 'FAIL',
                 'checks':checks,'record_counts':{
                   'incoming':r.get('incoming_count'),'new':r.get('new_count'),
                   'brand_conflicts':r.get('brand_conflict_count'),
                   'held_new':r.get('held_new_counts')},
                 'limitations':['Cross-source identity is not proven by UPC/MPN screening',
                                'Read-only recovery simulation is not a production transaction guarantee',
                                'No production sync or cursor advancement was tested']}
          with open('/tmp/ss-audit-summary.json','w') as f: json.dump(audit,f,indent=2,sort_keys=True)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          lines=['## Sports South consolidated read-only audit',
                 '**Result:** '+audit['overall'],'',
                 '| Check | Result |','|---|---|']
          lines += ['| '+k.replace('_',' ')+' | '+('PASS' if v else 'FAIL')+' |' for k,v in checks.items()]
          lines += ['','**Production writes:** disabled. **Checkpoint writes:** disabled.',
                    'See sanitized JSON artifacts for aggregate review counts.']
          if summary:
            with open(summary,'a') as f:f.write('\n'.join(lines)+'\n')
          for k,v in checks.items():print(('PASS' if v else 'FAIL')+': '+k)
          if not all(checks.values()):sys.exit('Consolidated audit failed; inspect JSON report')
          PY
      - name: Upload consolidated audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-south-consolidated-audit
          path: /tmp/ss-audit-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload sanitized import-readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-south-import-readiness
          path: /tmp/ss-import-readiness.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary supplier data
        if: always()
        shell: bash
        run: rm -f /tmp/ss-pagination-summary.json /tmp/ss-page-request.xml /tmp/ss-page-response.xml /tmp/ss-request.xml /tmp/ss-response.xml /tmp/ss-continuation-request.xml /tmp/ss-continuation-response.xml /tmp/ss.wsdl /tmp/ss-action /tmp/ss-import-readiness.json /tmp/ss-audit-summary.json
