name: Sports South SOAP 1.1 authenticated test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only supplier audit (production import retired)'
        type: choice
        options:
          - dry_run
        default: dry_run
      overlap_days:
        description: 'Read-only SOAP lookback (0-3 days); no cursor advancement'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
        default: '0'

permissions:
  contents: read

jobs:
  soap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SS_CUSTOMER: ${{ secrets.SPORTS_SOUTH_CUSTOMER_NUMBER }}
      SS_USERNAME: ${{ secrets.SPORTS_SOUTH_USERNAME }}
      SS_PASSWORD: ${{ secrets.SPORTS_SOUTH_PASSWORD }}
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SS_CUSTOMER SS_USERNAME SS_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
      - name: Request DailyItemUpdate over SOAP 1.1
        env:
          OVERLAP_DAYS: ${{ inputs.overlap_days }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 --tlsv1.2 --tls-max 1.2 \
            --ciphers 'ECDHE-RSA-AES128-SHA256' \
            'https://webservices.theshootingwarehouse.com/smart/inventory.asmx?WSDL' \
            --output /tmp/ss.wsdl
          python3 - <<'PY'
          import os,datetime,xml.etree.ElementTree as ET
          wsdl=ET.parse('/tmp/ss.wsdl').getroot()
          xs='{http://www.w3.org/2001/XMLSchema}'
          schemas=[s for s in wsdl.findall('.//'+xs+'schema')
                   if any(e.get('name')=='DailyItemUpdate' for e in s.findall(xs+'element'))]
          if len(schemas)!=1: raise SystemExit('Expected one DailyItemUpdate schema')
          schema=schemas[0]
          ns=schema.get('targetNamespace')
          qualified=schema.get('elementFormDefault')=='qualified'
          element=next(e for e in schema.findall(xs+'element') if e.get('name')=='DailyItemUpdate')
          definitions=element.findall('.//'+xs+'sequence/'+xs+'element')
          lookback=int(os.environ.get('OVERLAP_DAYS') or '0')
          if lookback not in (0,1,2,3): raise SystemExit('Unsupported lookback')
          request_day=datetime.datetime.now(datetime.timezone.utc).date()-datetime.timedelta(days=lookback)
          print('SOAP read-only lookback days:',lookback)
          values={
            'CustomerNumber':os.environ['SS_CUSTOMER'],
            'UserName':os.environ['SS_USERNAME'],
            'Password':os.environ['SS_PASSWORD'],
            'LastUpdate':request_day.strftime('%m/%d/%Y'),
            'LastItem':'0',
            'Source':''
          }
          env='http://schemas.xmlsoap.org/soap/envelope/'
          ET.register_namespace('soap',env)
          ET.register_namespace('svc',ns)
          root=ET.Element('{%s}Envelope'%env)
          body=ET.SubElement(root,'{%s}Body'%env)
          operation=ET.SubElement(body,'{%s}DailyItemUpdate'%ns)
          for definition in definitions:
            name=definition.get('name')
            if name not in values: raise SystemExit('Unexpected WSDL parameter: '+name)
            tag=('{%s}%s'%(ns,name)) if qualified else name
            ET.SubElement(operation,tag).text=values[name]
          if len(definitions)!=len(values): raise SystemExit('WSDL parameter count mismatch')
          # Report the supplier's declared continuation inputs without exposing
          # credentials or making an additional SOAP request.
          continuation_inputs=[d.get('name') for d in definitions if
            any(t in d.get('name','').lower() for t in ('lastitem','page','offset','cursor','start'))]
          print('WSDL continuation-related request fields:',continuation_inputs)
          print('WSDL lists LastItem; supplier documentation specifies last returned ITEMNO as continuation.')

          ET.ElementTree(root).write('/tmp/ss-request.xml',encoding='utf-8',xml_declaration=True)
          print('SOAP request generated from live WSDL schema (body withheld).')
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/ss.wsdl').getroot()
          ws='{http://schemas.xmlsoap.org/wsdl/}'
          soap='{http://schemas.xmlsoap.org/wsdl/soap/}'
          actions=[]
          for binding in root.findall(ws+'binding'):
            if binding.find(soap+'binding') is None: continue
            for op in binding.findall(ws+'operation'):
              if op.get('name')=='DailyItemUpdate':
                action=op.find(soap+'operation')
                if action is not None and action.get('soapAction'):
                  actions.append(action.get('soapAction'))
          if len(set(actions))!=1: raise SystemExit('Missing or ambiguous SOAP 1.1 action')
          with open('/tmp/ss-action','w') as out: out.write(actions[0])
          print('SOAPAction extracted from WSDL; matches hardcoded previous action:',actions[0]=='https://webservices.theshootingwarehouse.com/smart/inventory.asmx/DailyItemUpdate')
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ws='{http://schemas.xmlsoap.org/wsdl/}'
          xs='{http://www.w3.org/2001/XMLSchema}'
          soapenv='{http://schemas.xmlsoap.org/soap/envelope/}'
          definitions=ET.parse('/tmp/ss.wsdl').getroot()
          schema=next((s for s in definitions.findall('.//'+xs+'schema')
                       if any(e.get('name')=='DailyItemUpdate' for e in s.findall(xs+'element'))),None)
          if schema is None: raise SystemExit('WSDL missing DailyItemUpdate schema')
          ns=schema.get('targetNamespace')
          qualified=schema.get('elementFormDefault')=='qualified'
          element=next(e for e in schema.findall(xs+'element') if e.get('name')=='DailyItemUpdate')
          expected=element.findall('.//'+xs+'sequence/'+xs+'element')
          root=ET.parse('/tmp/ss-request.xml').getroot()
          body=root.find(soapenv+'Body')
          if body is None or len(body)!=1: raise SystemExit('Invalid SOAP body structure')
          operation=body[0]
          if operation.tag!='{%s}DailyItemUpdate'%ns: raise SystemExit('Operation namespace mismatch')
          children=list(operation)
          if len(children)!=len(expected): raise SystemExit('SOAP parameter count mismatch')
          for child,definition in zip(children,expected):
            name=definition.get('name')
            expected_tag=('{%s}%s'%(ns,name)) if qualified else name
            if child.tag!=expected_tag: raise SystemExit('SOAP parameter name/namespace/order mismatch at '+name)
            typ=definition.get('type','')
            if typ.endswith(':int'):
              try: int(child.text or '')
              except ValueError: raise SystemExit('Invalid integer parameter: '+name)
            elif not typ.endswith(':string'):
              raise SystemExit('Unrecognized WSDL parameter type: '+name)
            print('WSDL parameter validated:',name,'type:',typ.split(':')[-1],
                  'populated:',bool(child.text and child.text.strip()))
          print('SOAP request matches WSDL parameter order, namespace and declared types.')
          print('Note: WSDL cannot validate supplier-specific accepted values or account access.')
          PY
          SOAP_ACTION="$(cat /tmp/ss-action)"
          status="$(curl --silent --show-error --max-time 50 --tlsv1.2 --tls-max 1.2 \
            --ciphers 'ECDHE-RSA-AES128-SHA256' \
            --header 'Content-Type: text/xml; charset=utf-8' \
            --header "SOAPAction: \"$SOAP_ACTION\"" \
            --data-binary @/tmp/ss-request.xml \
            --output /tmp/ss-response.xml --write-out '%{http_code}' \
            'https://webservices.theshootingwarehouse.com/smart/inventory.asmx')"
          echo "HTTP status: $status"
          SS_HTTP_STATUS="$status" python3 - <<'PY'
          import os,re,xml.etree.ElementTree as ET
          path='/tmp/ss-response.xml'
          print('Response bytes:',os.path.getsize(path))
          try: root=ET.parse(path).getroot()
          except ET.ParseError: raise SystemExit('Non-XML response; contents withheld')
          print('XML root:',root.tag.split('}')[-1])
          names=[x.tag.split('}')[-1] for x in root.iter()]
          print('SOAP fault present:', 'Fault' in names)
          print('DailyItemUpdateResult present:', 'DailyItemUpdateResult' in names)
          if 'Fault' in names:
            fault=next(x for x in root.iter() if x.tag.split('}')[-1]=='Fault')
            def value(tag):
              return next((x.text or '' for x in fault.iter() if x.tag.split('}')[-1].lower()==tag.lower()),'')
            code=value('faultcode').split(':')[-1]
            if code in ('Client','Server','Sender','Receiver','VersionMismatch','MustUnderstand'):
              print('SOAP fault code:',code)
            else:
              print('SOAP fault code: unrecognized (withheld)')
            raw_detail=value('faultstring')
            detail=raw_detail.lower()
            categories=[
              ('Authentication or authorization',('credential','password','username','user name','authentication','unauthorized','access denied','login','invalid user')),
              ('Customer account validation',('customer number','customernumber','account number','customer not found')),
              ('LastUpdate parameter validation',('lastupdate','last update','date format','invalid date')),
              ('LastItem parameter validation',('lastitem','last item')),
              ('Source parameter validation',('source parameter','invalid source','source is required')),
              ('Server-side processing',('internal server','object reference','null reference','database','exception','server error')),
            ]
            classification=next((label for label,keywords in categories if any(k in detail for k in keywords)),'Unclassified SOAP fault')
            print('Sanitized fault classification:',classification)
            # Redact every known secret and avoid printing arbitrary supplier text.
            safe=raw_detail
            for secret_name in ('SS_CUSTOMER','SS_USERNAME','SS_PASSWORD'):
              secret=os.environ.get(secret_name,'')
              if secret: safe=safe.replace(secret,'[REDACTED]')
            safe=re.sub(r'[\\w.+-]+@[\\w.-]+\\.[A-Za-z]{2,}','[EMAIL]',safe)
            safe=re.sub(r'\\b\\d{4,}\\b','[NUMBER]',safe)
            safe=re.sub(r'https?://\\S+','[URL]',safe)
            # Only print known generic .NET/SOAP validation messages, never arbitrary errors.
            patterns=[
              r'Server was unable to read request',
              r'There is an error in XML document',
              r'Input string was not in a correct format',
              r'was not recognized as a valid DateTime',
              r'was not recognized as a valid Int32',
              r'Value cannot be null',
              r'Invalid SOAPAction',
              r'Server did not recognize the value of HTTP Header SOAPAction',
              r'Root element is missing',
              r'Unexpected end of file',
            ]
            matched=[p for p in patterns if re.search(p,safe,re.I)]
            print('Recognized SOAP validation phrases:', ', '.join(matched) if matched else 'none')
            # Display only an allowlisted vocabulary, never arbitrary values or identifiers.
            allowed=set(('server error unable to process request exception occurred while executing method'
              ' object reference not set instance null value parameter invalid format input'
              ' string correct date time integer conversion failed authentication login'
              ' credentials account customer source lastupdate lastitem username password'
              ' access denied unauthorized required missing provided expected unexpected'
              ' database connection timeout operation failed error internal application'
              ' was is the a an of in on for with from to and or as at by this that'
              ' could cannot can not be has have been no found recognized supplied'
              ' item update daily SOAP fault service remote returned during processing'
              ' data query syntax near incorrect table procedure stored permission'
              ' number user name credentials invalid request').lower().split())
            tokens=re.findall(r'[A-Za-z]+|[0-9]+|[^A-Za-z0-9]+',safe)
            scrubbed=''.join(t if (not t.isalnum() and len(t)<=3 and not any(ch in t for ch in '<>')) or (t.isalpha() and t.lower() in allowed) else '[redacted]' for t in tokens)
            print('Allowlisted SOAP fault text:',scrubbed[:250])
            print('SOAP fault character count:',len(raw_detail))
            print('Raw fault text withheld to protect credentials and supplier data.')
            raise SystemExit('SOAP fault returned; no catalog data modified')
          if os.environ['SS_HTTP_STATUS']!='200':
            raise SystemExit('Unexpected HTTP status; contents withheld')
          if 'DailyItemUpdateResult' not in names:
            raise SystemExit('Expected result element missing; contents withheld')
          result=next((x for x in root.iter() if x.tag.split('}')[-1]=='DailyItemUpdateResult'),None)
          if result is None: raise SystemExit('Result element missing')
          from collections import Counter
          from io import StringIO
          print('Result immediate child count:',len(result))
          print('Result immediate child tags:',dict(Counter(x.tag.split('}')[-1] for x in result)) if len(result) else {})
          print('Result text characters:',len(result.text or ''))
          print('Result nested element count:',sum(1 for _ in result.iter())-1)
          # Inspect structural metadata only; never print supplier record values.
          if len(result):
            counts=Counter(x.tag.split('}')[-1] for x in result.iter())
            print('Common nested XML element names:',counts.most_common(20))
          elif (result.text or '').lstrip().startswith('<'):
            try:
              inner=ET.fromstring(result.text)
              counts=Counter(x.tag.split('}')[-1] for x in inner.iter())
              print('Escaped inner XML root:',inner.tag.split('}')[-1])
              print('Common inner XML element names:',counts.most_common(20))
            except ET.ParseError:
              print('Inner result is not directly parseable XML')
          else:
            print('Result text appears non-XML or empty; content withheld')
          # Dry-run only: parse supplier rows and assess safe import candidates.
          if not (result.text or '').strip():
            raise SystemExit('Empty supplier result; refusing to treat as valid update')
          data=ET.fromstring(result.text)
          rows=[x for x in data if x.tag.split('}')[-1]=='Table']
          seen=set()
          duplicates=missing_id=valid=0
          fields=Counter()
          for row in rows:
            record={child.tag.split('}')[-1].upper():(child.text or '').strip() for child in row}
            fields.update(record.keys())
            item=record.get('ITEMNO','')
            if not item:
              missing_id+=1
              continue
            if item in seen:
              duplicates+=1
              continue
            seen.add(item)
            valid+=1
          if len(rows)==0: raise SystemExit('No Table records in supplier response')
          if missing_id or duplicates: raise SystemExit('Dry-run validation failed: missing or duplicate ITEMNO')
          print('DRY RUN - supplier records:',len(rows))
          print('DRY RUN - unique ITEMNO candidates:',valid)
          print('DRY RUN - missing ITEMNO:',missing_id)
          print('DRY RUN - duplicate ITEMNO:',duplicates)
          print('DRY RUN - field coverage:',{k:fields[k] for k in ('ITEMNO','IDESC','SHDESC','IMFGNO','IMFSEQ','ITYPE','CATCD')})
          print('DRY RUN - pricing fields explicitly excluded from planned import.')
          print('DRY RUN - insert/update/skip comparison pending read-only database lookup.')
          print('DRY RUN - database writes: 0; sync checkpoint changes: 0.')
          print('SOAP 1.1 request succeeded; response structure inspected; no data imported.')
          PY
      - name: Fetch bounded complete SOAP delta (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,xml.etree.ElementTree as ET,json
          first_path='/tmp/ss-response.xml'
          request_path='/tmp/ss-request.xml'
          action=open('/tmp/ss-action').read().strip()
          def parse(path):
            root=ET.parse(path).getroot()
            if any(e.tag.split('}')[-1]=='Fault' for e in root.iter()):
              raise SystemExit('SOAP fault during pagination; response withheld')
            results=[e for e in root.iter() if e.tag.split('}')[-1]=='DailyItemUpdateResult']
            if len(results)!=1 or not (results[0].text or '').strip():
              raise SystemExit('Missing or ambiguous SOAP result during pagination')
            dataset=ET.fromstring(results[0].text)
            rows=[r for r in dataset if r.tag.split('}')[-1]=='Table']
            ids=[]
            for row in rows:
              fields=[(c.text or '').strip() for c in row if c.tag.split('}')[-1].upper()=='ITEMNO']
              if len(fields)!=1 or not fields[0].isdecimal(): raise SystemExit('Invalid numeric ITEMNO in supplier page')
              ids.append(fields[0])
            if len(ids)!=len(set(ids)): raise SystemExit('Duplicate ITEMNO within supplier page')
            return root,results[0],dataset,rows,ids
          root,result,data,rows,ids=parse(first_path)
          if not ids: raise SystemExit('Empty initial supplier page')
          seen=set(ids)
          all_rows=list(rows)
          page_counts=[len(ids)]
          used_cursors=set()
          # Vendor contract: LastItem is the LAST ITEMNO RETURNED, not the
          # numerically largest ITEMNO. Bound to 10 pages / 10,000 rows.
          for page in range(2,11):
            if page_counts[-1]<1000: break
            cursor=ids[-1]
            if cursor in used_cursors: raise SystemExit('Repeated supplier continuation cursor')
            used_cursors.add(cursor)
            req=ET.parse(request_path)
            matches=[e for e in req.getroot().iter() if e.tag.split('}')[-1]=='LastItem']
            if len(matches)!=1: raise SystemExit('Ambiguous LastItem parameter')
            matches[0].text=str(cursor)
            next_request='/tmp/ss-page-request.xml'
            next_response='/tmp/ss-page-response.xml'
            req.write(next_request,encoding='utf-8',xml_declaration=True)
            cmd=['curl','--fail','--silent','--show-error','--max-time','50',
                 '--tlsv1.2','--tls-max','1.2','--ciphers','ECDHE-RSA-AES128-SHA256',
                 '--header','Content-Type: text/xml; charset=utf-8',
                 '--header','SOAPAction: "'+action+'"','--data-binary','@'+next_request,
                 '--output',next_response,
                 'https://webservices.theshootingwarehouse.com/smart/inventory.asmx']
            subprocess.run(cmd,check=True,timeout=60)
            _,_,_,new_rows,new_ids=parse(next_response)
            if set(new_ids)&seen: raise SystemExit('Overlapping supplier pages; refusing incomplete audit')
            # Do not impose numeric sorting: the vendor only specifies
            # continuing after the last returned item, not numeric order.
            if new_ids and new_ids[-1] in used_cursors:
              raise SystemExit('Supplier continuation cursor repeated')
            seen.update(new_ids)
            all_rows.extend(new_rows)
            page_counts.append(len(new_ids))
            ids=new_ids
            print('SOAP pagination page:',page,'rows:',len(new_ids),'total:',len(seen))
            if not new_ids: break
          if page_counts[-1]>=1000:
            raise SystemExit('Pagination safety cap reached with full page; dataset completeness unverified')
          # Replace the initial SOAP result in memory with the complete,
          # validated dataset. Existing Supabase reconciliation then runs once.
          for row in all_rows[len(rows):]:
            data.append(row)
          result.text=ET.tostring(data,encoding='unicode')
          ET.ElementTree(root).write(first_path,encoding='utf-8',xml_declaration=True)
          summary={'pages':len(page_counts),'page_counts':page_counts,
                   'total_unique':len(seen),'last_page_partial':True,
                   'bounded_pagination_passed':True,
                   'supplier_contract_confirmed':True}
          with open('/tmp/ss-pagination-summary.json','w') as out: json.dump(summary,out)
          print('SOAP PAGINATION: PASS; page counts:',page_counts,'unique records:',len(seen))
          print('SOAP PAGINATION: vendor-documented continuation; no writes.')
          PY
      - name: Compare supplier records with Supabase (read only)
        shell: bash
        env:
          IMPORT_MODE: ${{ inputs.mode }}
          OVERLAP_DAYS: ${{ inputs.overlap_days }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          CONFIRMATION_PHRASE: ${{ inputs.confirmation_phrase }}
          ENABLE_SPORTS_SOUTH_WRITES: 'false'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo '::error::Missing SUPABASE_SERVICE_ROLE_KEY; import readiness cannot be verified'
            exit 1
          fi
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from collections import Counter
          root=ET.parse('/tmp/ss-response.xml').getroot()
          result=next((e for e in root.iter() if e.tag.split('}')[-1]=='DailyItemUpdateResult'),None)
          if result is None or not (result.text or '').strip(): raise SystemExit('Missing supplier result')
          dataset=ET.fromstring(result.text)
          incoming={}
          for e in dataset:
            if e.tag.split('}')[-1]!='Table': continue
            fields={c.tag.split('}')[-1].upper():(c.text or '').strip() for c in e}
            item=fields.get('ITEMNO','')
            if not item or item in incoming: raise SystemExit('Invalid or duplicate ITEMNO')
            incoming[item]=fields
          if not incoming: raise SystemExit('No incoming rows')
          # Pagination audit runs before reconciliation; full combined response is expected.\n          # Exactly 1000 rows was observed in the expanded window. Until
          # continuation semantics are verified against the supplier WSDL,
          # treat this as a possible truncated page, not a complete delta.
          response_at_possible_cap=(len(incoming)>=1000)
          if response_at_possible_cap:
            print('::warning::Supplier returned >=1000 rows; completeness NOT established. No cursor advancement permitted.')
          else:
            print('Supplier response below observed 1000-row boundary; completeness still subject to supplier semantics.')

          if len(incoming)>10000: raise SystemExit('Safety stop: unexpected supplier response size')
          endpoint='https://cyrmysbcrpiadchcpsfa.supabase.co/rest/v1/cc_sports_south_products'
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          existing={}
          ids=list(incoming)
          for start in range(0,len(ids),50):
            batch=ids[start:start+50]
            query=urllib.parse.urlencode({'select':'item_no,description,short_description,manufacturer_item_no,model,upc,brand_id,category_id,image_ref,attributes',
              'item_no':'in.('+','.join('"'+x.replace('\\\\','\\\\\\\\').replace('"','\\\\"')+'"' for x in batch)+')'})
            request=urllib.request.Request(endpoint+'?'+query,headers={
              'apikey':key,'Authorization':'Bearer '+key,'Accept':'application/json'})
            with urllib.request.urlopen(request,timeout=25) as response:
              records=json.load(response)
            for record in records: existing[str(record['item_no'])]=record
          # Compare confirmed/high-confidence candidates separately; do not write data.
          # Historical brand IDs usually align with IMFGNO; inspect mismatches before importing.
          mappings={'description':'IDESC','short_description':'SHDESC',
                    'model':'IMODEL','brand_id':'IMFGNO'}
          changes={column:0 for column in mappings}
          changed_rows=unchanged=inserts=0
          for item,fields in incoming.items():
            row=existing.get(item)
            if row is None:
              inserts+=1
              continue
            any_change=False
            for column,source_field in mappings.items():
              if source_field not in fields:
                raise SystemExit('Required supplier field missing: '+source_field)
              before=str(row.get(column) or '').strip()
              after=fields[source_field]
              if before!=after:
                changes[column]+=1
                any_change=True
            if any_change: changed_rows+=1
            else: unchanged+=1
          from collections import Counter
          coverage=Counter()
          for fields in incoming.values(): coverage.update(fields.keys())
          print('SUPABASE READ-ONLY EXTENDED COMPARISON')
          print('Incoming records:',len(incoming))
          print('Existing ITEMNO matches:',len(existing))
          print('New ITEMNO:',inserts)
          print('Existing records with one or more mapped-field differences:',changed_rows)
          print('Existing records unchanged across mapped fields:',unchanged)
          for column,source_field in mappings.items():
            print('Field changes %s (%s): %d'%(column,source_field,changes[column]))
          print('Supplier field coverage:',{field:coverage[field] for field in sorted(coverage)})
          print('Not compared as authoritative mappings: manufacturer_item_no, category_id, upc, image_ref, attributes')
          print('Supplier pricing fields excluded; no pricing values logged or imported.')

          # Diagnostic only: evaluate candidate source fields without changing stored data.
          # Report aggregate equality and data shapes, not raw supplier values.
          candidates=['MFGINO','CATID','IMFGNO','IMFSEQ','ITYPE','CATCD','CSEQ','IMODEL','ITUPC','PICREF','SCNAM1','SCNAM2']
          targets=['manufacturer_item_no','category_id','brand_id','model','upc','image_ref']
          print('CANDIDATE FIELD MATCH MATRIX (existing records only)')
          for target in targets:
            present=sum(1 for item in incoming if item in existing and str(existing[item].get(target) or '').strip())
            print('Target %s: populated existing values %d/%d'%(target,present,len(existing)))
            scores=[]
            for field in candidates:
              comparable=sum(1 for item,values in incoming.items() if item in existing and field in values and str(existing[item].get(target) or '').strip() and values[field])
              equal=sum(1 for item,values in incoming.items() if item in existing and field in values and str(existing[item].get(target) or '').strip() and values[field] and str(existing[item].get(target) or '').strip()==values[field])
              if comparable: scores.append((equal,comparable,field))
            for equal,comparable,field in sorted(scores,reverse=True):
              print('  %s: %d/%d exact matches'%(field,equal,comparable))
          print('Candidate mapping hypothesis: manufacturer_item_no=MFGINO, category_id=CATID, brand_id=IMFGNO, model=IMODEL, upc=ITUPC, image_ref=PICREF.')
          print('Candidate equality alone does not authorize production writes; inspect nonmatching rows separately.')
          # Brand mismatch audit: report aggregate causes and anonymized item fingerprints.
          # A missing brand in the local reference table is NOT permission to overwrite.
          mismatches=[(item,existing[item],fields) for item,fields in incoming.items()
