name: Sports South SOAP 1.1 authenticated test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SS_CUSTOMER: ${{ secrets.SPORTS_SOUTH_CUSTOMER_NUMBER }}
      SS_USERNAME: ${{ secrets.SPORTS_SOUTH_USERNAME }}
      SS_PASSWORD: ${{ secrets.SPORTS_SOUTH_PASSWORD }}
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SS_CUSTOMER SS_USERNAME SS_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
      - name: Request DailyItemUpdate over SOAP 1.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, datetime, xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape
          ns='http://webservices.theshootingwarehouse.com/smart/inventory.asmx'
          env='http://schemas.xmlsoap.org/soap/envelope/'
          ET.register_namespace('soap',env)
          root=ET.Element('{%s}Envelope'%env)
          body=ET.SubElement(root,'{%s}Body'%env)
          operation=ET.SubElement(body,'{%s}DailyItemUpdate'%ns)
          fields={
            'CustomerNumber':os.environ['SS_CUSTOMER'],
            'UserName':os.environ['SS_USERNAME'],
            'Password':os.environ['SS_PASSWORD'],
            'LastUpdate':datetime.datetime.now(datetime.timezone.utc).strftime('%m/%d/%Y'),
            'LastItem':'0',
            'Source':''
          }
          for name,value in fields.items():
            ET.SubElement(operation,'{%s}%s'%(ns,name)).text=value
          ET.ElementTree(root).write('/tmp/ss-request.xml',encoding='utf-8',xml_declaration=True)
          print('SOAP 1.1 request generated (body withheld).')
          PY
          curl --fail --silent --show-error --max-time 25 --tlsv1.2 --tls-max 1.2 \
            --ciphers 'ECDHE-RSA-AES128-SHA256' \
            'https://webservices.theshootingwarehouse.com/smart/inventory.asmx?WSDL' \
            --output /tmp/ss.wsdl
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/ss.wsdl').getroot()
          ws='{http://schemas.xmlsoap.org/wsdl/}'
          soap='{http://schemas.xmlsoap.org/wsdl/soap/}'
          actions=[]
          for binding in root.findall(ws+'binding'):
            if binding.find(soap+'binding') is None: continue
            for op in binding.findall(ws+'operation'):
              if op.get('name')=='DailyItemUpdate':
                action=op.find(soap+'operation')
                if action is not None and action.get('soapAction'):
                  actions.append(action.get('soapAction'))
          if len(set(actions))!=1: raise SystemExit('Missing or ambiguous SOAP 1.1 action')
          with open('/tmp/ss-action','w') as out: out.write(actions[0])
          print('SOAPAction extracted from WSDL; matches hardcoded previous action:',actions[0]=='https://webservices.theshootingwarehouse.com/smart/inventory.asmx/DailyItemUpdate')
          PY
          SOAP_ACTION="$(cat /tmp/ss-action)"
          status="$(curl --silent --show-error --max-time 50 --tlsv1.2 --tls-max 1.2 \
            --ciphers 'ECDHE-RSA-AES128-SHA256' \
            --header 'Content-Type: text/xml; charset=utf-8' \
            --header "SOAPAction: \"$SOAP_ACTION\"" \
            --data-binary @/tmp/ss-request.xml \
            --output /tmp/ss-response.xml --write-out '%{http_code}' \
            'https://webservices.theshootingwarehouse.com/smart/inventory.asmx')"
          echo "HTTP status: $status"
          SS_HTTP_STATUS="$status" python3 - <<'PY'
          import os,re,xml.etree.ElementTree as ET
          path='/tmp/ss-response.xml'
          print('Response bytes:',os.path.getsize(path))
          try: root=ET.parse(path).getroot()
          except ET.ParseError: raise SystemExit('Non-XML response; contents withheld')
          print('XML root:',root.tag.split('}')[-1])
          names=[x.tag.split('}')[-1] for x in root.iter()]
          print('SOAP fault present:', 'Fault' in names)
          print('DailyItemUpdateResult present:', 'DailyItemUpdateResult' in names)
          if 'Fault' in names:
            fault=next(x for x in root.iter() if x.tag.split('}')[-1]=='Fault')
            def value(tag):
              return next((x.text or '' for x in fault.iter() if x.tag.split('}')[-1].lower()==tag.lower()),'')
            code=value('faultcode').split(':')[-1]
            if code in ('Client','Server','Sender','Receiver','VersionMismatch','MustUnderstand'):
              print('SOAP fault code:',code)
            else:
              print('SOAP fault code: unrecognized (withheld)')
            raw_detail=value('faultstring')
            detail=raw_detail.lower()
            categories=[
              ('Authentication or authorization',('credential','password','username','user name','authentication','unauthorized','access denied','login','invalid user')),
              ('Customer account validation',('customer number','customernumber','account number','customer not found')),
              ('LastUpdate parameter validation',('lastupdate','last update','date format','invalid date')),
              ('LastItem parameter validation',('lastitem','last item')),
              ('Source parameter validation',('source parameter','invalid source','source is required')),
              ('Server-side processing',('internal server','object reference','null reference','database','exception','server error')),
            ]
            classification=next((label for label,keywords in categories if any(k in detail for k in keywords)),'Unclassified SOAP fault')
            print('Sanitized fault classification:',classification)
            # Redact every known secret and avoid printing arbitrary supplier text.
            safe=raw_detail
            for secret_name in ('SS_CUSTOMER','SS_USERNAME','SS_PASSWORD'):
              secret=os.environ.get(secret_name,'')
              if secret: safe=safe.replace(secret,'[REDACTED]')
            safe=re.sub(r'[\\w.+-]+@[\\w.-]+\\.[A-Za-z]{2,}','[EMAIL]',safe)
            safe=re.sub(r'\\b\\d{4,}\\b','[NUMBER]',safe)
            safe=re.sub(r'https?://\\S+','[URL]',safe)
            # Only print known generic .NET/SOAP validation messages, never arbitrary errors.
            patterns=[
              r'Server was unable to read request',
              r'There is an error in XML document',
              r'Input string was not in a correct format',
              r'was not recognized as a valid DateTime',
              r'was not recognized as a valid Int32',
              r'Value cannot be null',
              r'Invalid SOAPAction',
              r'Server did not recognize the value of HTTP Header SOAPAction',
              r'Root element is missing',
              r'Unexpected end of file',
            ]
            matched=[p for p in patterns if re.search(p,safe,re.I)]
            print('Recognized SOAP validation phrases:', ', '.join(matched) if matched else 'none')
            # Display only an allowlisted vocabulary, never arbitrary values or identifiers.
            allowed=set(('server error unable to process request exception occurred while executing method'
              ' object reference not set instance null value parameter invalid format input'
              ' string correct date time integer conversion failed authentication login'
              ' credentials account customer source lastupdate lastitem username password'
              ' access denied unauthorized required missing provided expected unexpected'
              ' database connection timeout operation failed error internal application'
              ' was is the a an of in on for with from to and or as at by this that'
              ' could cannot can not be has have been no found recognized supplied'
              ' item update daily SOAP fault service remote returned during processing'
              ' data query syntax near incorrect table procedure stored permission'
              ' number user name credentials invalid request').lower().split())
            tokens=re.findall(r'[A-Za-z]+|[0-9]+|[^A-Za-z0-9]+',safe)
            scrubbed=''.join(t if (not t.isalnum() and len(t)<=3 and not any(ch in t for ch in '<>')) or (t.isalpha() and t.lower() in allowed) else '[redacted]' for t in tokens)
            print('Allowlisted SOAP fault text:',scrubbed[:250])
            print('SOAP fault character count:',len(raw_detail))
            print('Raw fault text withheld to protect credentials and supplier data.')
            raise SystemExit('SOAP fault returned; no catalog data modified')
          if os.environ['SS_HTTP_STATUS']!='200':
            raise SystemExit('Unexpected HTTP status; contents withheld')
          if 'DailyItemUpdateResult' not in names:
            raise SystemExit('Expected result element missing; contents withheld')
          print('SOAP 1.1 request succeeded; no data imported.')
          PY
      - name: Remove temporary supplier data
        if: always()
        shell: bash
        run: rm -f /tmp/ss-request.xml /tmp/ss-response.xml /tmp/ss.wsdl /tmp/ss-action
