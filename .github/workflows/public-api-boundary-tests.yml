name: Additional public API rejection checks
on:
  push:
    paths:
      - '.github/workflows/public-api-boundary-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check invalid tokens and consultation request size
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://cyrmysbcrpiadchcpsfa.supabase.co/functions/v1"
          failures=0
          check() {
            label="$1"; expected="$2"; shift 2
            status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$@")
            echo "$label HTTP $status expected $expected"
            if [ "$status" != "$expected" ]; then failures=$((failures+1)); fi
          }
          check light_invalid_bearer 401 -X POST "$ROOT/cc-weapon-light-review" -H 'origin: https://coppercustom.com' -H 'authorization: Bearer invalid.test.token' -H 'content-type: application/json' --data '{}'
          check accessories_invalid_bearer 401 -X POST "$ROOT/cc-provisional-accessories" -H 'authorization: Bearer invalid.test.token' -H 'content-type: application/json' --data '{}'
          check consultation_large_body 413 -X POST "$ROOT/submit-copper-consultation" -H 'origin: https://coppercustom.com' -H 'content-type: application/json' --data-binary @<(python3 -c 'print("x"*31000)')
          check consultation_wrong_method 405 -X GET "$ROOT/submit-copper-consultation" -H 'origin: https://coppercustom.com'
          echo "Unexpected responses: $failures"
          test "$failures" -eq 0
