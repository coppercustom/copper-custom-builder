name: Gateway header trust probe (one-shot)
on:
  push:
    paths:
      - '.github/workflows/gateway-header-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test each header independently; capture expected HTTP rejection
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cyrmysbcrpiadchcpsfa.supabase.co/functions/v1/cc-gateway-header-diagnostic"
          for mode in baseline cf real forwarded combined; do
            headers=()
            case "$mode" in
              cf) headers=(-H 'cf-connecting-ip: 192.0.2.123');;
              real) headers=(-H 'x-real-ip: 192.0.2.123');;
              forwarded) headers=(-H 'x-forwarded-for: 192.0.2.123');;
              combined) headers=(-H 'cf-connecting-ip: 192.0.2.123' -H 'x-real-ip: 192.0.2.123' -H 'x-forwarded-for: 192.0.2.123');;
            esac
            status=$(curl --silent --show-error --max-time 15 -X POST "$URL" -H 'x-cc-probe: gateway-header-test-v1' -H 'x-cc-sentinel: 192.0.2.123' "${headers[@]}" -o result.json -w '%{http_code}')
            echo "$mode HTTP $status"
            if [ "$status" = 200 ]; then
              python3 -c 'import json; d=json.load(open("result.json")); print({k:bool(v) for k,v in d.items()})'
            elif [ "$status" = 403 ]; then
              echo "$mode blocked upstream or by platform (no diagnostic response)"
            else
              echo "Unexpected HTTP status $status"
              exit 1
            fi
          done
